services:
  api:
    build: .
    ports:
      - "8282:8282"
    volumes:
      - ./settings.toml:/srv/settings.toml:ro
    environment:
      QWEN_URL: ${QWEN_URL:-http://ollama:11434}
      MAX_FILES: ${MAX_FILES:-}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-}
      PG_POOL_SIZE: ${PG_POOL_SIZE:-}
      CHAT_API_TOKEN: ${CHAT_API_TOKEN:-}
      DATA_IMPORT_TOKEN: ${DATA_IMPORT_TOKEN:-}
      DATA_IMPORT_TIMEOUT: ${DATA_IMPORT_TIMEOUT:-}
      ORACLE_HOST: ${ORACLE_HOST:-}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASS: ${ORACLE_PASS:-}
      ORACLE_NAME: ${ORACLE_NAME:-}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA:-APXWS}
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-qwen}
      PGUSER: ${POSTGRES_USER:-qwen}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      qwen-loader:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qwen-loader:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"'
    restart: "no"

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qwen}
      POSTGRES_USER: ${POSTGRES_USER:-qwen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-history.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:

  ollama_data:
    name: ${OLLAMA_VOLUME_NAME:-queenapi_ollama_data}
